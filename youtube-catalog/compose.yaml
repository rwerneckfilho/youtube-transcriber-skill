name: youtube-catalog
services:
  catalog:
    build: .
    image: youtube-catalog:local
    init: true
    restart: "no"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8765}:8765"
    environment:
      TRANSCRIPTS_DIR: /transcripts
      DATA_DIR: /data
      STATIC_DIR: /app/static
      SCAN_INTERVAL_SECONDS: "60"
      DOWNLOAD_THUMBNAILS: "${DOWNLOAD_THUMBNAILS:-true}"
    volumes:
      - type: bind
        source: ${YOUTUBE_TRANSCRIPTS_DIR:-../yt-transcripts}
        target: /transcripts
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
