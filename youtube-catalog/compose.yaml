name: youtube-catalog
services:
  catalog:
    build: .
    image: youtube-catalog:local
    init: true
    restart: "no"
    user: "1000:1000"
    ports:
      - "127.0.0.1:${CATALOG_PORT:-8765}:8765"
    environment:
      TRANSCRIPTS_DIR: /storage/transcripts
      DATA_DIR: /storage/catalog
      MODEL_DIR: /storage/models
      WORK_DIR: /storage/work
      STATIC_DIR: /app/static
      SCAN_INTERVAL_SECONDS: "60"
      DOWNLOAD_THUMBNAILS: "${DOWNLOAD_THUMBNAILS:-true}"
      WHISPER_THREADS: "${WHISPER_THREADS:-4}"
      PLAYLIST_WATCHER_ENABLED: "${PLAYLIST_WATCHER_ENABLED:-true}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      SKILL_MODEL: "${SKILL_MODEL:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/storage
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  storage:
    name: "${CATALOG_VOLUME:-youtube-catalog-storage}"
